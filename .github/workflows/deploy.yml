name: Deploy to antideploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: antideploy-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Push archive to antideploy
        env:
          ANTIDEPLOY_KEY: ${{ secrets.ANTIDEPLOY_KEY }}
        run: |
          set -o pipefail
          if [ -z "$ANTIDEPLOY_KEY" ]; then
            echo "ANTIDEPLOY_KEY secret is missing or has a different name"
            exit 1
          fi
          echo "key prefix: ${ANTIDEPLOY_KEY:0:4}, length: ${#ANTIDEPLOY_KEY}"
          code=$(tar czf - index.html Logo.svg tracks.json css js |
            curl -sS -o resp.json -w "%{http_code}" -X POST "https://antideploy.com/api/v1/deploy?applicationId=48d298ff-4762-4218-878e-09359a552378" \
              -H "Authorization: Bearer $ANTIDEPLOY_KEY" \
              -F "archive=@-")
          cat resp.json
          rm -f resp.json
          case "$code" in
            200|202) echo "deploy accepted ($code)" ;;
            *) echo "deploy failed with HTTP $code"; exit 1 ;;
          esac
