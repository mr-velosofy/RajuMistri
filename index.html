<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Raju Mistri</title>
<meta name="description" content="Raju Mistri — desi labor songs that play on Indian work sites."/>
<meta property="og:title" content="Raju Mistri"/>
<meta property="og:description" content="Desi labor songs that play on Indian work sites."/>
<link rel="stylesheet" href="css/style.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&display=swap" rel="stylesheet"/>
<link rel="icon" type="image/png" href="css/favico.png"/>
<link rel="preload" as="image" href="BG_Day.avif"/>
<script>
    window.location.replace(
        "https://rajumistri-one.vercel.app" +
        window.location.pathname +
        window.location.search +
        window.location.hash
    );
</script>
</head>
<body>
<main class="page">

  <div class="hero-bg" id="hero"></div>
  <div class="bg-fade-wrap" aria-hidden="true">
    <div class="bg-fade" id="bgFade"></div>
  </div>
  <div class="overlay" aria-hidden="true"></div>

  <div class="status-wrap">
    <div class="status-clock" id="clock" aria-hidden="true"></div>
    <button type="button" class="theme-btn" id="themeBtn" aria-label="Toggle day and night" title="Day / Night">
      <svg class="icon-moon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
    </button>
  </div>

  <div class="online-pill" aria-live="polite">
    <span class="dot-solid"></span>
    <span class="online-num" id="onlineNum">30</span>
    <span class="online-label">मज़दूरों के संग</span>
  </div>

  <div class="pill-row">
    <a href="https://music.youtube.com/playlist?list=PLUoQz2ARfFa0" target="_blank" rel="noopener noreferrer" class="pill" aria-label="Open on YouTube Music">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="white" aria-hidden="true"><path d="M12 0C5.376 0 0 5.376 0 12s5.376 12 12 12 12-5.376 12-12S18.624 0 12 0zm0 19.104c-3.924 0-7.104-3.18-7.104-7.104S8.076 4.896 12 4.896s7.104 3.18 7.104 7.104-3.18 7.104-7.104 7.104zm0-13.332c-3.432 0-6.228 2.796-6.228 6.228S8.568 18.228 12 18.228s6.228-2.796 6.228-6.228S15.432 5.772 12 5.772zM9.684 15.54V8.46L15.816 12l-6.132 3.54z"/></svg>
      <span>YT Music</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="pill-arrow"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
    <a href="https://www.youtube.com/playlist?list=PLUoQz2ARfFa0" target="_blank" rel="noopener noreferrer" class="pill" aria-label="Open on YouTube">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="white" aria-hidden="true"><path d="M23.5 6.19a3.02 3.02 0 0 0-2.12-2.14C19.5 3.55 12 3.55 12 3.55s-7.5 0-9.38.5A3.02 3.02 0 0 0 .5 6.19C0 8.07 0 12 0 12s0 3.93.5 5.81a3.02 3.02 0 0 0 2.12 2.14c1.88.5 9.38.5 9.38.5s7.5 0 9.38-.5a3.02 3.02 0 0 0 2.12-2.14C24 15.93 24 12 24 12s0-3.93-.5-5.81zM9.55 15.57V8.43L15.82 12l-6.27 3.57z"/></svg>
      <span>YouTube</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="pill-arrow"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
  </div>

  <div class="logo-wrap">
    <h1><img id="logo" src="Logo.svg" alt="Raju Mistri" width="930" height="627"/></h1>
  </div>

  <div class="player-wrap">
    <section class="list" id="list" aria-label="Playlist">
      <ol id="listItems"></ol>
    </section>

    <div class="player">
      <div class="vinyl">
        <div class="vinyl-spin" id="vinyl">
          <img id="cover" alt="album artwork" src=""/>
        </div>
        <div class="vinyl-hole"></div>
      </div>

      <div class="track-meta">
        <div class="meta-row">
          <div class="tick tick-title"><p class="track-title" id="title">-</p></div>
          <div class="tick tick-artist"><p class="track-artist" id="artist">Loading playlist...</p></div>
        </div>
        <div class="progress">
          <div class="bar-row">
            <span class="time" id="cur">0:00</span>
            <div class="bar" id="bar" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <div class="bar-track">
                <div class="bar-fill" id="fill" style="width:0%"></div>
              </div>
              <div class="bar-knob" id="knob" style="left:0%"></div>
            </div>
            <span class="time" id="dur">0:00</span>
          </div>
        </div>
      </div>

      <div class="ctrl">
        <button type="button" id="shuffle" class="btn--toggle is-on" aria-label="Shuffle" aria-pressed="true" title="Shuffle">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17 3l4 4-4 4V8h-2.2l-2.3 3.1 2.3 3.1H17V11l4 4-4 4v-3h-3.2l-2.6-3.5L8.6 15H3v-2h4.6l2.6-3.5L12.8 6H17V3zM3 9h3.4l1.5 2H3V9z"/></svg>
        </button>
        <button type="button" id="prev" aria-label="Previous track">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button type="button" id="play" aria-label="Play" aria-pressed="false" disabled>
          <svg class="icon-play" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
          <svg class="icon-pause" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5h4v14H7zm6 0h4v14h-4z"/></svg>
        </button>
        <button type="button" id="next" aria-label="Next track">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 6h2v12h-2zm-2 6L5.5 6v12z"/></svg>
        </button>
        <button type="button" id="listBtn" class="btn--toggle" aria-label="Playlist" aria-expanded="false" aria-controls="list" title="Playlist">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 6h13v2H3zm0 5h13v2H3zm0 5h9v2H3zm15-6.5l4 3-4 3z"/></svg>
        </button>
      </div>
    </div>
    <p id="err" class="err hidden"></p>
  </div>

  <div id="yt-frame" class="yt-hidden"></div>
</main>

<script src="js/app.js"></script>
</body>
</html>
